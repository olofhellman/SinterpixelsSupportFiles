<h2 id="toc_1">About the Name</h2>

<p>Sinterpixels gets its name because it is an app with a Scripting INTERface for generation of pixel-based artwork.  There&#39;s some use of a graphical UI as well, but much of the value of the app lives in its scriptability.</p>
